version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install
      - run:
          name: Tests
          command: npm run test --if-present
      - run:
          name: Build
          command: npm run build

workflows:
  ci-cd:
    jobs:
      - build-and-test
